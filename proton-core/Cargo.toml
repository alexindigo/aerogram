[package]
name = "aerogram-proton-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Aerogram's Proton Mail core: C ABI over Proton's Rust mail stack"

[lib]
crate-type = ["staticlib", "rlib"]

# Proton's mail stack, pinned to the archived rust-mail repo (the
# `clients` monorepo's workspace is mid-restructure and unbuildable at
# HEAD; rust-mail is its self-contained, fully vendored snapshot).
[dependencies]
proton-mail-common = { git = "https://github.com/ProtonMail/rust-mail", rev = "3b6d35b766c10d91b1ffa68e1c5ee47ffca2a67e", features = ["test-utils"] }
proton-core-api = { git = "https://github.com/ProtonMail/rust-mail", rev = "3b6d35b766c10d91b1ffa68e1c5ee47ffca2a67e" }
proton-account-api = { git = "https://github.com/ProtonMail/rust-mail", rev = "3b6d35b766c10d91b1ffa68e1c5ee47ffca2a67e" }
proton-core-common = { git = "https://github.com/ProtonMail/rust-mail", rev = "3b6d35b766c10d91b1ffa68e1c5ee47ffca2a67e" }
proton-issue-reporter-service = { git = "https://github.com/ProtonMail/rust-mail", rev = "3b6d35b766c10d91b1ffa68e1c5ee47ffca2a67e" }
proton-log-service = { git = "https://github.com/ProtonMail/rust-mail", rev = "3b6d35b766c10d91b1ffa68e1c5ee47ffca2a67e" }
proton-network-monitor-service = { git = "https://github.com/ProtonMail/rust-mail", rev = "3b6d35b766c10d91b1ffa68e1c5ee47ffca2a67e" }
aerogram-html-sanitize = { path = "../html-sanitize-core" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = "0.8"
anyhow = "1"
tracing = "0.1"
