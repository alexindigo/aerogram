[package]
name = "aerogram-html-sanitize"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Aerogram's shared email-HTML sanitizer: Proton's Transformer pipeline, standalone"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
proton-mail-html-transformer = { git = "https://github.com/ProtonMail/rust-mail", rev = "3b6d35b766c10d91b1ffa68e1c5ee47ffca2a67e" }
serde_json = "1"

[dev-dependencies]
# none
