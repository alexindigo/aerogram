[package]
name = "aerogram-html-sanitize"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Aerogram's shared email-HTML sanitizer: Proton's Transformer pipeline, standalone"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["ffi"]
ffi = ["serde_json"]

[dependencies]
lol_html = "3"
html2text = "0.16"
serde_json = { version = "1", optional = true }

[dev-dependencies]
# none
