# Proton's crates partly live on their own registry and (for muon) on
# their private GitLab. muon is vendored from ProtonMail/rust-mail's
# `3rdparty/` (pinned rev matches the git dependency pin in
# proton-core/Cargo.toml).
[registries.proton]
index = "sparse+https://rust-registry.proton.me/index/"

[source."git+https://gitlab.protontech.ch/rust/inbox/muon.git?rev=2970c71eaa5dd5c1c4f127535870d16155ef46da"]
git = "https://gitlab.protontech.ch/rust/inbox/muon.git"
rev = "2970c71eaa5dd5c1c4f127535870d16155ef46da"
replace-with = "vendored-muon"

[source.vendored-muon]
directory = "third-party/rust-mail-vendor"
